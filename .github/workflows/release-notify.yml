name: Discord Release Announcement

on:
  release:
    types: [published]

jobs:
  discord-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Release Embed to Discord
        run: |
          BODY_TEXT=$(echo "${{ github.event.release.body }}" | head -c 1800 | jq -sRr @json)
          RELEASE_TITLE=$(echo "${{ github.event.release.name }}" | jq -sRr @json)
          TAG_NAME="${{ github.event.release.tag_name }}"
          RELEASE_URL="${{ github.event.release.html_url }}"
          AUTHOR_NAME="${{ github.actor }}"
          AUTHOR_ICON="${{ github.event.sender.avatar_url }}"

          PAYLOAD=$(cat <<EOF
          {
            "username": "Serto Phone Updates",
            "avatar_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
            "embeds": [
              {
                "title": $RELEASE_TITLE,
                "url": "$RELEASE_URL",
                "color": 65386,
                "description": $BODY_TEXT,
                "fields": [
                  {
                    "name": "🏷️ Sürüm",
                    "value": "\`$TAG_NAME\`",
                    "inline": true
                  },
                  {
                    "name": "👤 Geliştirici",
                    "value": "$AUTHOR_NAME",
                    "inline": true
                  }
                ],
                "footer": {
                  "text": "Serto Phone Development • Lore-Friendly Ecosystem",
                  "icon_url": "$AUTHOR_ICON"
                }
              }
            ]
          }
          EOF
          )

          curl -H "Content-Type: application/json" \
               -X POST \
               -d "$PAYLOAD" \
               ${{ secrets.DISCORD_WEBHOOK }}
